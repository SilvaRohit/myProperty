name: Build, test and deploy property app

on:
  push:
    branches: [aws-deployment]
    paths:
      - 'code/**'
      - 'deploy/**'
      - '.github/workflows/build-ecr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-ecr-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-7
  ECR_REGISTRY: 147997138960.dkr.ecr.ap-southeast-7.amazonaws.com
  ECR_REPOSITORY_URL: 147997138960.dkr.ecr.ap-southeast-7.amazonaws.com/property-app-dev

jobs:
  publish:
    if: github.repository == 'SilvaRohit/myProperty' && github.ref == 'refs/heads/aws-deployment'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        # actions/checkout v6, resolved from upstream on 2026-10-20.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Test deployment target resolver
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v

      - name: Check AWS role configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo 'Create the repository Actions variable AWS_ROLE_ARN first.' >&2
            exit 1
          fi

      - name: Authenticate to AWS with OIDC
        # aws-actions/configure-aws-credentials v6.3.0.
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: property-ecr-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '147997138960'

      - name: Resolve the current EC2 deployment target
        if: vars.AUTO_DEPLOY_ENABLED == 'true'
        id: target
        env:
          TARGET_PARAMETER: ${{ vars.EC2_TARGET_PARAMETER }}
          LEGACY_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: python3 deploy/resolve-target.py >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build, test and push versioned image
        id: image
        run: |
          set -euo pipefail
          image_tag="sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_uri="${ECR_REPOSITORY_URL}:${image_tag}"

          # Native x86_64 runner and image match the existing t3.micro EC2.
          docker build --platform linux/amd64 \
            --file ./code/Dockerfile.ci \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$image_uri" ./code
          # Run this branch's complete unit suite in the exact image being published.
          docker run --rm --entrypoint npm "$image_uri" run coverage
          docker push "$image_uri"

          printf 'image_uri=%s\n' "$image_uri" >> "$GITHUB_OUTPUT"
          printf '### Published image\n\n`%s`\n\nPlatform: `linux/amd64`\n' \
            "$image_uri" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the published image through Systems Manager
        if: vars.AUTO_DEPLOY_ENABLED == 'true'
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          DOCUMENT_NAME: ${{ vars.SSM_DEPLOY_DOCUMENT }}
        run: |
          set -euo pipefail
          python3 deploy/request-deploy.py \
            --image "$IMAGE_URI" \
            --instance "$INSTANCE_ID" \
            --document "$DOCUMENT_NAME"

      - name: Check the public HTTPS website
        if: vars.AUTO_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            https://property.tecerotech.com/)
          if [[ "$status" != 200 ]]; then
            echo "HTTPS check returned HTTP $status. The image is deployed; inspect DNS and Caddy." >&2
            exit 1
          fi
          printf '\nDeployment and public HTTPS check succeeded.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain build-only mode
        if: vars.AUTO_DEPLOY_ENABLED != 'true'
        run: |
          printf '\nImage published. Automatic deployment is disabled until AUTO_DEPLOY_ENABLED=true.\n' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of ECR
        if: always()
        run: docker logout "$ECR_REGISTRY"
