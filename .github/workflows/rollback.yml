name: Rollback property app
run-name: Rollback property app by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

# Same group as build-ecr.yml when it runs on aws-deployment.
# Automatic deployment remains enabled; the two workflows run one at a time.
concurrency:
  group: property-ecr-refs/heads/aws-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-7

jobs:
  rollback:
    if: github.repository == 'SilvaRohit/myProperty'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check selected branch and repository variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DOCUMENT_NAME: ${{ vars.SSM_ROLLBACK_DOCUMENT }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/aws-deployment ]]; then
            echo 'Select aws-deployment in the Run workflow branch dropdown.' >&2
            exit 1
          fi
          [[ -n "$AWS_ROLE_ARN" ]] || { echo 'AWS_ROLE_ARN is missing.' >&2; exit 1; }
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ]] || { echo 'EC2_INSTANCE_ID is invalid.' >&2; exit 1; }
          [[ "$DOCUMENT_NAME" =~ ^[A-Za-z0-9_.-]{3,128}$ ]] || { echo 'SSM_ROLLBACK_DOCUMENT is missing or invalid.' >&2; exit 1; }

      - name: Authenticate to AWS with existing OIDC role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: property-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ap-southeast-7
          allowed-account-ids: '147997138960'

      - name: Roll back to the previous image
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DOCUMENT_NAME: ${{ vars.SSM_ROLLBACK_DOCUMENT }}
          REQUEST_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time

          def aws(*args):
              return subprocess.run(
                  ['aws', '--region', os.environ['AWS_REGION'], '--no-cli-pager', 'ssm', *args, '--output', 'json'],
                  text=True, capture_output=True, timeout=40
              )

          result = aws('send-command', '--instance-ids', os.environ['INSTANCE_ID'],
                       '--document-name', os.environ['DOCUMENT_NAME'], '--document-version', '$LATEST',
                       '--timeout-seconds', '120',
                       '--parameters', json.dumps({'RequestId': [os.environ['REQUEST_ID']]}),
                       '--comment', 'GitHub rollback to the previous property app image')
          if result.returncode:
              sys.exit(result.stderr)
          command_id = json.loads(result.stdout)['Command']['CommandId']
          print(f'SSM rollback command: {command_id}', flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Rollback request\n\nSSM command: `{command_id}`\n')
          deadline = time.monotonic() + 1900
          while time.monotonic() < deadline:
              result = aws('get-command-invocation', '--command-id', command_id,
                           '--instance-id', os.environ['INSTANCE_ID'])
              if result.returncode:
                  if 'InvocationDoesNotExist' not in result.stderr:
                      sys.exit(result.stderr)
              else:
                  invocation = json.loads(result.stdout)
                  status = invocation['Status']
                  if status not in {'Pending', 'InProgress', 'Delayed', 'Cancelling'}:
                      print(f"SSM result: {status}; {invocation.get('StatusDetails', '')}")
                      print(invocation.get('StandardOutputContent', ''))
                      print(invocation.get('StandardErrorContent', ''), file=sys.stderr)
                      sys.exit(0 if status == 'Success' else 1)
              time.sleep(5)
          sys.exit('Timed out waiting. Inspect this SSM command before starting another workflow run.')
          PY

      - name: Check the public HTTPS website
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' https://property.tecerotech.com/)
          if [[ "$status" != 200 ]]; then
            echo "HTTPS returned HTTP $status. Inspect Caddy/DNS and the rollback output." >&2
            exit 1
          fi
          printf '\nRollback completed and the public HTTPS check passed.\n' >> "$GITHUB_STEP_SUMMARY"
